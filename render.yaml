services:
  - type: web
    name: vetbridge-api
    runtime: docker
    repo: https://github.com/wisewaytutors/vetbridge-backend
    branch: main
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "3000"
