services:
  - type: redis
    name: vetbridge-redis
    plan: free
    ipAllowList: []

  - type: web
    name: vetbridge-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: vetbridge-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: vetbridge-redis
          type: redis
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: PORT
        value: "3000"

databases:
  - name: vetbridge-postgres
    databaseName: vetbridge_db
    user: vetbridge_user
    plan: free
