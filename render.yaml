# Render Blueprint — deploy from GitHub: New → Blueprint → select this repo
# https://render.com/docs/blueprint-spec

databases:
  - name: vetbridge-postgres
    databaseName: vetbridge_db
    user: vetbridge_user
    plan: free
    region: oregon

services:
  - type: redis
    name: vetbridge-redis
    plan: free
    region: oregon
    maxmemoryPolicy: allkeys-lru
    ipAllowList: []

  - type: web
    name: vetbridge-api
    runtime: docker
    repo: https://github.com/wisewaytutors/vetbridge-backend
    branch: main
    region: oregon
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "3000"
      - key: DATABASE_URL
        fromDatabase:
          name: vetbridge-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: vetbridge-redis
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
